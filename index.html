<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Craft Engine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div id="app">
        <!-- Launcher Screen -->
        <div id="launcher" class="screen">
            <div class="launcher-content">
                <h1>App Craft</h1>
                <p>Diseña el futuro de la web</p>
                <div class="launcher-actions">
                    <button id="btn-new-project" class="primary-btn">
                        <i class="fas fa-plus"></i> Nuevo Proyecto
                    </button>
                    <button id="btn-open-project" class="secondary-btn">
                        <i class="fas fa-folder-open"></i> Abrir Proyecto
                    </button>
                </div>
            </div>
        </div>

        <!-- Editor Screen (Hidden by default) -->
        <div id="editor" class="screen hidden">
            <!-- Layout will be injected here -->
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
