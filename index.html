<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Craft Editor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div class="editor-container">
        <header id="top-bar">
            <div class="app-title">App Craft - [Sin Proyecto]</div>
            <nav class="menu">
                <ul>
                    <li>Archivo</li>
                    <li>Editar</li>
                    <li>Configuración</li>
                    <li>Librerías</li>
                    <li>Ayuda</li>
                </ul>
            </nav>
        </header>
        <main id="main-layout">
            <aside id="left-panel">
                <div id="hierarchy-panel" class="window">
                    <div class="window-header">
                        <span>Jerarquía</span>
                        <button class="close-btn">X</button>
                    </div>
                    <div class="window-content">
                        <!-- Content for hierarchy -->
                    </div>
                </div>
                <div id="files-panel" class="window">
                    <div class="window-header">
                        <span>Navegador de Archivos</span>
                        <button class="close-btn">X</button>
                    </div>
                    <div class="window-content">
                        <!-- Content for files -->
                    </div>
                </div>
            </aside>
            <section id="center-panel">
                <div id="view-panel" class="window">
                     <div class="window-header">
                        <span>Vista</span>
                        <div class="view-controls">
                            <button>▶</button>
                            <button>❚❚</button>
                        </div>
                    </div>
                    <div class="window-content">
                        <!-- The main view area -->
                    </div>
                </div>
            </section>
            <aside id="right-panel">
                <div id="inspector-panel" class="window">
                    <div class="window-header">
                        <span>Inspector</span>
                        <button class="close-btn">X</button>
                    </div>
                    <div class="window-content">
                        <!-- Content for inspector -->
                    </div>
                </div>
            </aside>
        </main>
    </div>
    <script src="state.js"></script>
    <script src="ui.js"></script>
    <script src="inspector.js"></script>
    <script src="events.js"></script>
</body>
</html>
