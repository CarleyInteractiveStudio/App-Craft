<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Craft - Engine</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div id="app-container">
        <!-- Top Bar -->
        <header id="top-bar">
            <div class="logo">
                <i class="fas fa-cube"></i>
                <span>App Craft</span>
            </div>
            <div class="project-info">
                <span id="project-name">Sin Proyecto</span>
            </div>
            <div class="top-actions">
                <button id="btn-open-folder" title="Abrir Carpeta Local">
                    <i class="fas fa-folder-open"></i> Abrir
                </button>
                <button id="btn-save" title="Guardar Cambios">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main id="workspace">
            <!-- Left Panel: HTML Hierarchy -->
            <aside id="hierarchy-panel" class="panel">
                <div class="panel-header">
                    <i class="fas fa-sitemap"></i>
                    <span>HTML / Jerarquía</span>
                </div>
                <div class="panel-content" id="hierarchy-content">
                    <ul id="hierarchy-list"></ul>
                </div>
                <div class="panel-footer">
                    <button id="btn-add-element"><i class="fas fa-plus"></i> Añadir</button>
                </div>
            </aside>

            <!-- Center Panel: Live View & Gizmos -->
            <section id="view-panel">
                <div id="canvas-container">
                    <div id="canvas-frame">
                        <iframe id="project-view" sandbox="allow-scripts allow-same-origin"></iframe>
                        <!-- Gizmos will be rendered on top of the iframe or in a overlay div -->
                        <div id="gizmo-overlay"></div>
                    </div>
                </div>
            </section>

            <!-- Right Panel: CSS Rules / Inspector -->
            <aside id="inspector-panel" class="panel">
                <div class="panel-header">
                    <i class="fas fa-sliders-h"></i>
                    <span>Reglas / Estilos</span>
                </div>
                <div class="panel-content" id="inspector-content">
                    <div class="no-selection">Selecciona un elemento para editar</div>
                </div>
            </aside>
        </main>

        <!-- Status Bar -->
        <footer id="status-bar">
            <span id="status-text">Listo</span>
        </footer>
    </div>

    <!-- Main Entry Point -->
    <script type="module" src="src/main.js"></script>
</body>
</html>
